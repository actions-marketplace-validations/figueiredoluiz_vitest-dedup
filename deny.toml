[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"

[licenses]
version = 2
# self_cell is "Apache-2.0 OR GPL-2.0-only"; the Apache-2.0 option satisfies the policy.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSL-1.0",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
